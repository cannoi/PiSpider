# PiSpider Hybrid — SoloHost
# Do NOT mount ./config.json as a file. SoloHost sometimes creates a FOLDER
# named config.json; that breaks Docker (mount directory onto file).
# Config is written to ./data/pispider-config.json instead.

services:
  pispider-core:
    image: ghcr.io/cannoi/pispider:latest
    container_name: pispider-core
    labels:
      pi.ui.primary: "true"
    restart: unless-stopped
    ports:
      - "127.0.0.1:18770:18770"
    volumes:
      - ./data:/data
      - ./:/solohost-config:rw
    environment:
      PISPIDER_CONFIG: /data/pispider-config.json
      PISPIDER_DATA: /data
      SOLOHOST_CONFIG: /solohost-config
      WINDOWS_UI: http://host.docker.internal:18771
      TZ: Asia/Ho_Chi_Minh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 128m
    cpus: "0.25"
