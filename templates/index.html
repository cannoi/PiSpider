<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PiSpider</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background:#f4f5f7; color:#222; margin:0; }
    .wrap { max-width:720px; margin:0 auto; padding:16px; }
    button { font-size:16px; padding:12px 16px; margin:4px 4px 4px 0; border:0; border-radius:8px; cursor:pointer; }
    .go { background:#1e7850; color:#fff; width:100%; font-weight:700; }
    .sec { background:#fff; border:1px solid #ddd; border-radius:8px; padding:12px; margin:12px 0; }
    pre { white-space:pre-wrap; font-size:13px; }
    .err { color:#a33; }
    label { display:block; margin:8px 0; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>PiSpider</h1>
  <p>One confirm starts the Windows Worker. Buttons talk to the same bus the Worker reads.</p>
  <div id="terms" class="sec">
    <b>Terms</b>
    <pre>PiSpider watches the Pi Node on this Windows PC.
Smallest safe repair first. You can stop the Worker any time.</pre>
    <label><input id="agree" type="checkbox"> I agree — start Windows Worker</label>
    <button class="go" onclick="accept()">I AGREE — START</button>
  </div>
  <div id="panel" style="display:none">
    <button class="go" onclick="run('scan')">SCAN</button>
    <div>
      <button onclick="run('repair')">REPAIR</button>
      <button onclick="run('status')">STATUS</button>
      <button onclick="run('patrol')">PATROL</button>
      <button onclick="run('worker')">START WORKER</button>
    </div>
    <div class="sec"><b>NOW / DONE / NEXT</b><pre id="story">...</pre></div>
    <p><a href="/Activate_Worker.bat">Download Activate_Worker.bat</a> (only if Worker stays OFF)</p>
  </div>
  <div id="err" class="err"></div>
</div>
<script>
const BASES = ['', 'http://127.0.0.1:18770'];
async function api(path, opt){
  let last = 'no response';
  for (const b of BASES){
    try {
      const r = await fetch(b + path, Object.assign({
        headers: {'Content-Type':'application/json'}
      }, opt || {}));
      const j = await r.json();
      if (r.ok) return j;
      last = j.error || ('HTTP ' + r.status);
    } catch(e){ last = String(e); }
  }
  throw new Error(last);
}
async function refresh(){
  try {
    const r = await api('/api/status');
    document.getElementById('err').textContent = '';
    const agreed = !!r.termsAccepted;
    document.getElementById('terms').style.display = agreed ? 'none' : 'block';
    document.getElementById('panel').style.display = agreed ? 'block' : 'none';
    if (!agreed) return;
    const lines = [];
    lines.push('=== NOW ===');
    lines.push(r.workerAlive ? ('Worker ON busy=' + !!r.workerBusy) : 'Worker OFF');
    lines.push('Bus: ' + (r.busPath || ''));
    lines.push('');
    lines.push('=== DONE ===');
    const res = r.lastResult || {};
    lines.push(res.Action ? (res.Action + ' ' + (res.At||'') + ' ' + (res.Summary||'')) : 'No result yet');
    if (res.Health) lines.push('Health ' + res.Health);
    lines.push('');
    lines.push('=== NEXT ===');
    const cmd = r.lastCommand || {};
    lines.push(cmd.Action ? ('Last command ' + cmd.Action) : 'Press START CARE');
    if (!r.workerAlive) lines.push('If OFF: run WindowsWorker\\Activate_Worker.bat once, then press START CARE again.');
    document.getElementById('story').textContent = lines.join('\n');
  } catch(e){
    document.getElementById('err').textContent = 'Dashboard API: ' + e.message;
  }
}
async function accept(){
  if (!document.getElementById('agree').checked) { alert('Tick the checkbox.'); return; }
  try {
    const r = await api('/api/accept-terms', {method:'POST', body: JSON.stringify({accepted:true})});
    await api('/api/run', {method:'POST', body: JSON.stringify({script:'worker'})});
    await api('/api/run', {method:'POST', body: JSON.stringify({script:'scan'})});
    alert(r.hint || 'Started. If Worker is OFF, run Activate_Worker.bat once.');
    refresh();
  } catch(e){ document.getElementById('err').textContent = e.message; }
}
async function run(script){
  try {
    const r = await api('/api/run', {method:'POST', body: JSON.stringify({script})});
    document.getElementById('err').textContent = r.ok ? ('Queued ' + script) : (r.error||'fail');
    refresh();
  } catch(e){ document.getElementById('err').textContent = e.message; }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
